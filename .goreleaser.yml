version: 2

builds:
  - main: .
    binary: k3sctl
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/vinaycharlie01/k3sctl/version.Version={{.Version}}
      - -X github.com/vinaycharlie01/k3sctl/version.GitCommit={{.ShortCommit}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ignore:
      # k3s publishes linux/amd64, linux/arm64 and linux/armhf only; macOS
      # has no 32-bit arm build.
      - goos: darwin
        goarch: arm

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
