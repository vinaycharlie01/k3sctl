name: LXD Multi-Node K3s

# Three-node K3s cluster test using LXD system containers:
#   - 1 server node + 2 agent nodes as privileged Ubuntu 24.04 containers
#   - No KVM required — containers share the host kernel
#   - Near-instant boot (~seconds) vs minutes for QEMU/TCG VMs
#   - Containers share LXD's default bridge (lxdbr0) for inter-node traffic
#   - SSH via injected ed25519 keys
#   - K3s needs privileged + nesting + unconfined AppArmor
#
# Reference: https://github.com/corneliusweig/kubernetes-lxd
# Reference: https://github.com/canonical/setup-lxd
# This does NOT modify any existing workflow.

on:
  push:
    branches:
      - lxd-ci
    paths:
      - ".github/workflows/lxd-multinode.yml"
  workflow_dispatch:
    inputs:
      k3s_version:
        description: "K3s version to install (must start with 'v')"
        required: false
        default: "v1.37.1+k3s1"

permissions:
  contents: read

concurrency:
  group: lxd-multinode-${{ github.ref }}
  cancel-in-progress: true

env:
  K3S_VERSION: ${{ inputs.k3s_version || 'v1.37.1+k3s1' }}

jobs:
  multinode:
    name: 3-node cluster via LXD
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: arduino/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CLI
        run: task build

      - name: Setup LXD
        uses: canonical/setup-lxd@main
        with:
          channel: latest/stable

      - name: Load required kernel modules
        run: |
          set -euo pipefail
          for mod in overlay br_netfilter ip_tables ip6_tables nf_nat xt_conntrack; do
            sudo modprobe "${mod}" 2>/dev/null || echo "::warning::Module ${mod} not available (may be built-in)"
          done
          echo "Loaded modules:"
          lsmod | grep -E 'overlay|br_netfilter|ip_tables|nf_nat' || true

      - name: Create K3s LXD profile
        run: |
          set -euo pipefail

          cat > /tmp/k3s-profile.yaml <<'EOF'
          config:
            security.privileged: "true"
            security.nesting: "true"
            linux.kernel_modules: ip_tables,ip6_tables,netlink_diag,nf_nat,overlay,br_netfilter,xt_conntrack
            raw.lxc: |
              lxc.apparmor.profile=unconfined
              lxc.mount.auto=proc:rw sys:rw
          description: Profile for running K3s inside LXD containers
          devices: {}
          EOF

          lxc profile create k3s 2>/dev/null || true
          lxc profile edit k3s < /tmp/k3s-profile.yaml
          echo "--- K3s profile ---"
          lxc profile show k3s

      - name: Generate SSH keys
        run: |
          set -euo pipefail
          mkdir -p .ci-ssh
          ssh-keygen -t ed25519 -f .ci-ssh/id_ed25519 -N "" -q
          chmod 600 .ci-ssh/id_ed25519
          chmod 644 .ci-ssh/id_ed25519.pub
          echo "SSH_KEY=$(pwd)/.ci-ssh/id_ed25519" >> "$GITHUB_ENV"
          echo "SSH_PUB_KEY=$(cat .ci-ssh/id_ed25519.pub)" >> "$GITHUB_ENV"

      - name: Launch containers
        run: |
          set -euo pipefail

          for name in server agent1 agent2; do
            echo "Launching container: ${name}"
            lxc launch ubuntu:24.04 "${name}" --profile default --profile k3s
          done

          echo "Waiting for containers to initialize..."
          sleep 5
          lxc list

      - name: Configure containers
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          pass() { echo "PASS: $*"; }

          configure_container() {
            local name="$1"
            echo "=== Configuring ${name} ==="

            # Wait until the container is running
            local attempt=0 max=30
            while [ $attempt -lt $max ]; do
              state=$(lxc list "${name}" --format csv -c s)
              if [ "${state}" = "RUNNING" ]; then
                break
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            [ "${state}" = "RUNNING" ] || fail "${name} did not reach RUNNING state"

            # Create /dev/kmsg (K3s kubelet needs it, missing in containers)
            lxc exec "${name}" -- bash -c '[ -e /dev/kmsg ] || ln -s /dev/console /dev/kmsg'
            pass "${name}: /dev/kmsg configured"

            # Make mount propagation shared (K3s volume mounts need this)
            lxc exec "${name}" -- mount --make-rshared /
            pass "${name}: mount propagation set to rshared"

            # Set hostname
            lxc exec "${name}" -- hostnamectl set-hostname "${name}"

            # Wait for cloud-init to finish (sets up default user)
            lxc exec "${name}" -- cloud-init status --wait 2>/dev/null || true

            # Install openssh-server (fast in containers — native speed)
            lxc exec "${name}" -- bash -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y -qq openssh-server curl >/dev/null 2>&1
              systemctl enable --now ssh
            '
            pass "${name}: openssh-server installed"

            # Set up SSH access for ubuntu user
            lxc exec "${name}" -- bash -c "
              mkdir -p /home/ubuntu/.ssh
              echo '${SSH_PUB_KEY}' > /home/ubuntu/.ssh/authorized_keys
              chmod 700 /home/ubuntu/.ssh
              chmod 600 /home/ubuntu/.ssh/authorized_keys
              chown -R ubuntu:ubuntu /home/ubuntu/.ssh
              echo 'ubuntu ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ubuntu
              chmod 440 /etc/sudoers.d/ubuntu
            "
            pass "${name}: SSH keys configured"

            # Persist /dev/kmsg symlink across reboots
            lxc exec "${name}" -- bash -c '
              echo "L /dev/kmsg - - - - /dev/console" > /etc/tmpfiles.d/kmsg.conf
            '
          }

          configure_container "server"
          configure_container "agent1"
          configure_container "agent2"

      - name: Get container IPs and validate connectivity
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          pass() { echo "PASS: $*"; }

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o BatchMode=yes -i ${SSH_KEY}"

          get_ip() {
            local name="$1"
            # Get IPv4 address from LXD
            local ip
            ip=$(lxc list "${name}" --format csv -c 4 | awk '{print $1}')
            if [ -z "${ip}" ] || [ "${ip}" = "-" ]; then
              fail "${name} has no IP address"
            fi
            echo "${ip}"
          }

          server_IP=$(get_ip "server")
          agent1_IP=$(get_ip "agent1")
          agent2_IP=$(get_ip "agent2")

          echo "server_IP=${server_IP}" >> "$GITHUB_ENV"
          echo "agent1_IP=${agent1_IP}" >> "$GITHUB_ENV"
          echo "agent2_IP=${agent2_IP}" >> "$GITHUB_ENV"

          echo "Container IPs: server=${server_IP} agent1=${agent1_IP} agent2=${agent2_IP}"

          # Validate SSH to each container
          for name_ip in "server:${server_IP}" "agent1:${agent1_IP}" "agent2:${agent2_IP}"; do
            name="${name_ip%%:*}"
            ip="${name_ip##*:}"

            echo "=== Validating ${name} (${ip}) ==="

            # SSH connectivity
            ssh ${SSH_OPTS} "ubuntu@${ip}" "echo ok" >/dev/null || \
              fail "${name}: SSH not reachable at ${ip}"
            pass "${name}: SSH works"

            # Passwordless sudo
            ssh ${SSH_OPTS} "ubuntu@${ip}" "sudo -n true" || \
              fail "${name}: passwordless sudo unavailable"
            pass "${name}: passwordless sudo works"

            # Check systemd is PID 1
            pid1=$(ssh ${SSH_OPTS} "ubuntu@${ip}" "ps -p 1 -o comm=")
            [ "${pid1}" = "systemd" ] || fail "${name}: PID 1 is '${pid1}', not systemd"
            pass "${name}: systemd is PID 1"

            # Check internet access
            ssh ${SSH_OPTS} "ubuntu@${ip}" \
              "curl -sf --max-time 10 https://get.k3s.io >/dev/null" || \
              fail "${name}: cannot reach https://get.k3s.io"
            pass "${name}: internet connectivity OK"
          done

          # Inter-container connectivity
          echo "=== Inter-container connectivity ==="
          ssh ${SSH_OPTS} "ubuntu@${agent1_IP}" "ping -c 1 -W 3 ${server_IP}" >/dev/null || \
            fail "agent1 cannot reach server at ${server_IP}"
          pass "agent1 -> server connectivity OK"

          ssh ${SSH_OPTS} "ubuntu@${agent2_IP}" "ping -c 1 -W 3 ${server_IP}" >/dev/null || \
            fail "agent2 cannot reach server at ${server_IP}"
          pass "agent2 -> server connectivity OK"

      - name: Write cluster config
        run: |
          set -euo pipefail
          cat > k3sctl.yaml <<EOF
          apiVersion: k3sctl.k3sproject.io/v1beta1
          kind: Cluster
          metadata:
            name: ci-lxd
          spec:
            hosts:
              - role: server
                ssh:
                  address: ${server_IP}
                  user: ubuntu
                  keyPath: ${SSH_KEY}
                  port: 22
                privateAddress: ${server_IP}
                hostname: server
              - role: agent
                ssh:
                  address: ${agent1_IP}
                  user: ubuntu
                  keyPath: ${SSH_KEY}
                  port: 22
                privateAddress: ${agent1_IP}
                hostname: agent1
              - role: agent
                ssh:
                  address: ${agent2_IP}
                  user: ubuntu
                  keyPath: ${SSH_KEY}
                  port: 22
                privateAddress: ${agent2_IP}
                hostname: agent2
            k3s:
              version: "${K3S_VERSION}"
          EOF
          echo "--- k3sctl.yaml ---"
          cat k3sctl.yaml

      - name: Apply (install K3s cluster)
        run: |
          set -euo pipefail
          ./k3sctl --debug apply -c k3sctl.yaml 2>&1 | tee apply.log

      - name: Verify cluster is running
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          pass() { echo "PASS: $*"; }

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -i ${SSH_KEY}"

          # Check config status
          ./k3sctl config status -c k3sctl.yaml > status.out 2>&1
          cat status.out
          grep -q 'running' status.out || fail "config status does not report hosts as running"
          pass "config status reports running"

          # Check K3s version on server
          ssh ${SSH_OPTS} "ubuntu@${server_IP}" \
            "sudo /usr/local/bin/k3s --version" > k3s-version.out
          cat k3s-version.out
          grep -Fq "${K3S_VERSION}" k3s-version.out || \
            fail "installed K3s version does not match ${K3S_VERSION}"
          pass "installed version matches ${K3S_VERSION}"

          # Check k3s.service is active on server
          ssh ${SSH_OPTS} "ubuntu@${server_IP}" \
            "systemctl is-active --quiet k3s" || fail "k3s.service is not active on server"
          pass "k3s.service is active on server"

          # Check k3s-agent.service on agents
          for vm_ip in "${agent1_IP}" "${agent2_IP}"; do
            ssh ${SSH_OPTS} "ubuntu@${vm_ip}" \
              "systemctl is-active --quiet k3s-agent" || \
              fail "k3s-agent.service is not active on ${vm_ip}"
            pass "k3s-agent.service is active on ${vm_ip}"
          done

          # Verify all 3 nodes are Ready
          ssh ${SSH_OPTS} "ubuntu@${server_IP}" \
            "sudo /usr/local/bin/k3s kubectl get nodes" > nodes.out
          cat nodes.out
          node_count=$(grep -c ' Ready ' nodes.out || true)
          [ "${node_count}" -eq 3 ] || fail "expected 3 Ready nodes, got ${node_count}"
          pass "all 3 nodes are Ready"

          # List pods
          ssh ${SSH_OPTS} "ubuntu@${server_IP}" \
            "sudo /usr/local/bin/k3s kubectl get pods -A" > pods.out
          cat pods.out

      - name: Kubeconfig command
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          pass() { echo "PASS: $*"; }

          ./k3sctl kubeconfig -c k3sctl.yaml --api-address "https://${server_IP}:6443" \
            > kubeconfig.yaml 2> kubeconfig.log
          cat kubeconfig.log
          grep -q "server: https://${server_IP}:6443" kubeconfig.yaml || \
            fail "kubeconfig has an unexpected API address"
          pass "kubeconfig points at the requested API address"

      - name: Capture failure diagnostics
        if: failure()
        run: |
          set +e
          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=5 -i ${SSH_KEY}"

          collect_diag() {
            local name="$1" ip="$2" service="$3"
            echo "=== ${name} (${ip}) ==="
            {
              echo "--- lxc info ---"
              lxc info "${name}" 2>&1
              echo "--- ip addr ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "ip addr" 2>&1
              echo "--- systemctl status ${service} ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "systemctl status ${service} --no-pager" 2>&1
              echo "--- journalctl -u ${service} (last 100) ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "sudo journalctl -u ${service} --no-pager -n 100" 2>&1
              echo "--- free -m ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "free -m" 2>&1
              echo "--- df -h ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "df -h" 2>&1
              echo "--- /dev/kmsg ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "ls -la /dev/kmsg" 2>&1
              echo "--- cloud-init status ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "cloud-init status --long" 2>&1
              echo "--- mount (rshared check) ---"
              ssh ${SSH_OPTS} "ubuntu@${ip}" "findmnt -o TARGET,PROPAGATION /" 2>&1
            }
          }

          {
            collect_diag "server" "${server_IP}" "k3s"
            collect_diag "agent1" "${agent1_IP}" "k3s-agent"
            collect_diag "agent2" "${agent2_IP}" "k3s-agent"
          } > diagnostics.log 2>&1
          cat diagnostics.log

          # LXD container list
          lxc list > lxd-list.log 2>&1 || true
          cat lxd-list.log

      - name: Reset (remove K3s)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -x ./k3sctl ] || [ ! -f k3sctl.yaml ]; then
            echo "::warning::skipping reset: build or config missing"
            exit 0
          fi
          ./k3sctl reset -c k3sctl.yaml --force 2>&1 | tee reset.log || true

      - name: Destroy containers
        if: always()
        run: |
          set +e
          for name in server agent1 agent2; do
            echo "Destroying container: ${name}"
            lxc stop "${name}" --force 2>/dev/null || true
            lxc delete "${name}" --force 2>/dev/null || true
          done
          echo "All containers destroyed."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxd-multinode-logs
          path: |
            apply.log
            reset.log
            status.out
            nodes.out
            pods.out
            kubeconfig.log
            kubeconfig.yaml
            k3s-version.out
            diagnostics.log
            lxd-list.log
            k3sctl.yaml
          if-no-files-found: ignore
          retention-days: 7
