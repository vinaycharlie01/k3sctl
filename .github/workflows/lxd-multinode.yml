name: LXD Multi-Node K3s

# Three-node K3s cluster test using LXD system containers:
#   - 1 server node + 2 agent nodes as privileged Ubuntu 24.04 containers
#   - No KVM required - containers share the host kernel
#   - Containers share LXD's default bridge (lxdbr0) for inter-node traffic
#   - SSH via an ephemeral ed25519 key generated by the test
#   - K3s needs privileged + nesting + unconfined AppArmor
#
# Container lifecycle is handled by integration/lxd using the official
# github.com/canonical/lxd/client SDK. integration/multinode drives those
# nodes and runs the real k3sctl binary as the system under test.
#
# Local reproduction (requires a running LXD daemon):
#   task build
#   K3SCTL_LXD_INTEGRATION=1 \
#   K3SCTL_BINARY="$PWD/k3sctl" \
#     go test -tags=integration -timeout 30m -v ./integration/lxd/ \
#     -run TestLXDMultiNodeK3s
#
# This workflow does not modify any other workflow.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/lxd-multinode.yml"
      - "integration/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      k3s_version:
        description: "K3s version to install (must start with 'v')"
        required: false
        default: "v1.37.1+k3s1"

permissions:
  contents: read

concurrency:
  group: lxd-multinode-${{ github.ref }}
  cancel-in-progress: true

env:
  K3S_VERSION: ${{ inputs.k3s_version || 'v1.37.1+k3s1' }}
  K3SCTL_LXD_INTEGRATION: "1"
  # The test names every LXD resource "k3sctl-<run id>-...". The fallback
  # cleanup below uses the same identifier so it never touches other runs.
  K3SCTL_LXD_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  multinode:
    name: 3-node cluster via LXD
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup LXD
        uses: canonical/setup-lxd@main
        with:
          channel: latest/stable

      - name: Load required kernel modules
        run: |
          set -euo pipefail
          for mod in overlay br_netfilter ip_tables ip6_tables nf_nat xt_conntrack; do
            sudo modprobe "${mod}" 2>/dev/null || echo "::warning::Module ${mod} not available (may be built-in)"
          done
          echo "Loaded modules:"
          lsmod | grep -E 'overlay|br_netfilter|ip_tables|nf_nat' || true

      - name: Build k3sctl
        run: task build

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Unit tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile test-results/unit.xml \
            --format testname \
            -- -count=1 ./integration/...

      - name: Multi-node integration test
        env:
          K3SCTL_BINARY: ${{ github.workspace }}/k3sctl
          K3SCTL_ARTIFACT_DIR: ${{ github.workspace }}/integration-artifacts/${{ env.K3SCTL_LXD_RUN_ID }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile test-results/integration.xml \
            --format testname \
            -- -tags=integration -timeout 30m -v ./integration/lxd/ \
            -run TestLXDMultiNodeK3s

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lxd-multinode-logs
          path: |
            test-results/
            integration-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      # The Go test cleans up after itself, but a cancelled job can kill the
      # process before its deferred cleanup runs. This step only ever touches
      # resources belonging to this run.
      - name: Fallback LXD cleanup
        if: always()
        run: |
          set +e
          run_id="${{ env.K3SCTL_LXD_RUN_ID }}"
          prefix="k3sctl-${run_id}"
          echo "Cleaning up LXD resources matching ${prefix}"

          lxc list --format csv -c n 2>/dev/null | while IFS= read -r name; do
            [ -z "${name}" ] && continue
            case "${name}" in
              "${prefix}-"*)
                echo "Deleting instance ${name}"
                lxc delete --force "${name}" 2>/dev/null || true
                ;;
            esac
          done

          if lxc profile show "${prefix}" >/dev/null 2>&1; then
            echo "Deleting profile ${prefix}"
            lxc profile delete "${prefix}" 2>/dev/null || true
          fi

          lxc list || true
