name: Real K3s Install

# End-to-end test: installs a real single-node K3s cluster on the runner
# itself (via `localhost: true`), verifies it, and tears it down with `reset`.
#
# The test is implemented as a Go integration test in integration/localhost/,
# gated by K3SCTL_LOCALHOST_INTEGRATION=1.
#
# Local reproduction:
#   task build
#   K3SCTL_LOCALHOST_INTEGRATION=1 \
#   K3SCTL_BINARY="$PWD/k3sctl" \
#     go test -tags=integration -timeout 30m -v ./integration/localhost/ \
#     -run TestLocalhostSingleNode

on:
  push:
    branches:
      - main
      - ccr-385bb1e9-ed0ul0
      - feat/cli-smoke-and-parity
    paths:
      - ".github/workflows/real-install.yml"
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:
    inputs:
      k3s_version:
        description: "K3s version to install (must start with 'v')"
        required: false
        default: "v1.37.1+k3s1"
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

concurrency:
  group: real-install-${{ github.ref }}
  cancel-in-progress: false

env:
  K3S_VERSION: ${{ inputs.k3s_version || 'v1.37.1+k3s1' }}
  K3SCTL_LOCALHOST_INTEGRATION: "1"
  K3SCTL_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  install:
    name: Single-node install (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: arduino/setup-task@v2
        with:
          version: 3.54.0
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build k3sctl
        run: task build

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.12.0

      - name: Unit tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile test-results/unit.xml \
            --format testname \
            -- -count=1 ./integration/localhost/...

      - name: Single-node localhost integration test
        env:
          K3SCTL_BINARY: ${{ github.workspace }}/k3sctl
          K3SCTL_ARTIFACT_DIR: ${{ github.workspace }}/integration-artifacts/${{ env.K3SCTL_RUN_ID }}
        run: |
          set -euo pipefail
          mkdir -p test-results
          "$(go env GOPATH)/bin/gotestsum" \
            --junitfile test-results/integration.xml \
            --format testname \
            -- -tags=integration -timeout 30m -v ./integration/localhost/ \
            -run TestLocalhostSingleNode

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-install-logs
          path: |
            test-results/
            integration-artifacts/
          if-no-files-found: ignore
          retention-days: 7

      # Fallback cleanup in case the Go test is killed before its deferred
      # cleanup runs.
      - name: Fallback reset
        if: always()
        run: |
          set +e
          if [ -x ./k3sctl ]; then
            sudo -n rm -f /var/lock/k3sctl.lock
            artifact_dir="integration-artifacts/${{ env.K3SCTL_RUN_ID }}"
            config="${artifact_dir}/k3sctl.yaml"
            if [ -f "${config}" ]; then
              echo "Running fallback reset..."
              ./k3sctl reset -c "${config}" --force 2>&1 || true
            fi
          fi
